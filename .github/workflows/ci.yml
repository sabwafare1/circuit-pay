name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Compile check
        run: python -m py_compile xrpcli.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: CLI smoke test
        run: python xrpcli.py --help

      - name: Stablecoins command smoke test
        run: python xrpcli.py stablecoins --help

      - name: Send-stablecoin command smoke test
        run: python xrpcli.py send-stablecoin --help
